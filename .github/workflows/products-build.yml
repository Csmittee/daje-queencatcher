name: Daje Product Generator

on:
  push:
    paths:
      - 'products.csv'
      - 'scripts/generate_products.py'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate product pages
        run: |
          python scripts/generate_products.py
      
      - name: Commit and push changes
        # Changed: stage product/ and th/product/ (generated pages were never saved); DEP-6 retry loop 2026-10-26
        # Changed: no [skip ci] in the commit message — Cloudflare Pages skips deploying commits that carry it 2026-10-26
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A product/ th/product/ products.json sitemap.xml
          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate Daje product pages from CSV"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying in $((attempt * 5))s."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push generated product pages after 5 attempts."
          exit 1
